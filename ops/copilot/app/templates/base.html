<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IncidentPilot</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#dcdcd6;
          --ok:#1a7f4b; --warn:#a15c00; --bad:#b3261e; --accent:#2f5bd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecece8; --muted:#9a9a93; --card:#21211f; --line:#3a3a36;
            --ok:#4cc38a; --warn:#e0a03a; --bad:#f2766e; --accent:#7f9cf5; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  header { border-bottom:1px solid var(--line); padding:12px 16px; }
  header a { color:var(--fg); text-decoration:none; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:14px 0; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; font-size:13px; border:1px solid var(--line); }
  .high { color:var(--bad); } .medium { color:var(--warn); } .low { color:var(--muted); }
  .banner { background:var(--warn); color:#fff; padding:8px 16px; border-radius:8px; margin:14px 0; }
  .error { color:var(--bad); font-weight:600; }
  textarea { width:100%; box-sizing:border-box; min-height:70px; font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  button { font:inherit; padding:8px 16px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.approve { background:var(--bad); color:#fff; border-color:var(--bad); }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--accent); }
  pre { overflow:auto; background:var(--bg); padding:8px; border-radius:6px; font-size:13px; }
  .muted { color:var(--muted); } code { font-size:13px; }
</style></head>
<body><header><a href="/">IncidentPilot</a> <span class="muted">· evidence-grounded, human-approved rollback</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
